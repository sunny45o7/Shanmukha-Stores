name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: 'shanmukha-stores/package-lock.json'
    
    - name: Install dependencies
      working-directory: ./shanmukha-stores
      run: npm ci

    - name: Create .env
      working-directory: ./shanmukha-stores
      run: |
        echo "DB_USER=testuser" > .env
        echo "DB_PASSWORD=testpassword" >> .env
        echo "DB_NAME=testdb" >> .env
        echo "DB_HOST=localhost" >> .env
        echo "DB_PORT=5432" >> .env
        echo "SESSION_SECRET=testsecret" >> .env
        echo "PORT=3000" >> .env

    - name: Start Server & Run Tests
      working-directory: ./shanmukha-stores
      run: |
        node server.js &
        sleep 5
        npm test
